name: Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1) التحليل والاختبار ----------
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: App dependencies
        run: |
          cd app
          flutter pub get

      - name: Analyze App
        run: |
          cd app
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test App
        run: |
          cd app
          flutter test

      - name: Setup Dart (Server)
        uses: dart-lang/setup-dart@v1

      - name: Analyze Server
        run: |
          cd server
          dart pub get
          dart analyze --no-fatal-infos --no-fatal-warnings

  # ---------- 2) بناء Android ----------
  android:
    name: Build Android APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        run: |
          cd app
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: app/build/app/outputs/flutter-apk/*.apk

  # ---------- 3) بناء Web ----------
  web:
    name: Build Web
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Web
        run: |
          cd app
          flutter pub get
          flutter build web --release

      - name: Zip Web
        run: |
          cd app/build
          zip -r pos_web.zip web

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/build/pos_web.zip

  # ---------- 4) بناء Windows ----------
  windows:
    name: Build Windows
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows
        run: |
          cd app
          flutter pub get
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Zip Windows
        run: Compress-Archive -Path app\build\windows\x64\runner\Release\* -DestinationPath pos_windows.zip

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: pos_windows.zip

  # ---------- 5) بناء iOS (بدون توقيع) ----------
  ios:
    name: Build iOS (no codesign)
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build iOS
        run: |
          cd app
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Zip iOS payload
        run: |
          cd app/build/ios/iphoneos
          zip -r pos_ios.zip Runner.app

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: app/build/ios/iphoneos/pos_ios.zip

  # ---------- 6) بناء الخادم (Executable) ----------
  server:
    name: Build Server Executable
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Compile Server
        run: |
          cd server
          dart pub get
          dart compile exe bin/server.dart -o pos_server

      - name: Upload Server
        uses: actions/upload-artifact@v4
        with:
          name: server-exe
          path: server/pos_server

  # ---------- 7) إصدار Release بكل الملفات ----------
  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, web, windows, ios, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: POS Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
            artifacts/**/*.zip
            artifacts/**/pos_server
