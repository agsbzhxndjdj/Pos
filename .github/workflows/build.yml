name: Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 0) اكتشاف هيكل المستودع ----------
  detect:
    name: Detect Structure
    runs-on: ubuntu-latest
    outputs:
      app_dir: ${{ steps.d.outputs.app_dir }}
      has_server: ${{ steps.d.outputs.has_server }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect app & server paths
        id: d
        run: |
          if [ -f app/pubspec.yaml ]; then APP=app;
          elif [ -f pubspec.yaml ]; then APP=.;
          else echo "::error::ما لقيت pubspec.yaml لا في الجذر ولا في app/"; exit 1; fi
          echo "app_dir=$APP" >> $GITHUB_OUTPUT
          if [ -f server/pubspec.yaml ]; then echo "has_server=true" >> $GITHUB_OUTPUT; else echo "has_server=false" >> $GITHUB_OUTPUT; fi
          echo "✅ app_dir=$APP  has_server=$( [ -f server/pubspec.yaml ] && echo true || echo false )"

  # ---------- 1) التحليل والاختبار ----------
  analyze:
    name: Analyze & Test
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        working-directory: ${{ needs.detect.outputs.app_dir }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ needs.detect.outputs.app_dir }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test (if tests exist)
        working-directory: ${{ needs.detect.outputs.app_dir }}
        run: |
          if [ -d test ]; then flutter test; else echo "لا توجد اختبارات - تخطي"; fi

      - name: Setup Dart (Server)
        if: needs.detect.outputs.has_server == 'true'
        uses: dart-lang/setup-dart@v1

      - name: Analyze Server
        if: needs.detect.outputs.has_server == 'true'
        run: |
          cd server
          dart pub get
          dart analyze --no-fatal-infos --no-fatal-warnings

  # ---------- 2) Android ----------
  android:
    name: Build Android APK
    needs: [detect, analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        working-directory: ${{ needs.detect.outputs.app_dir }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: ${{ needs.detect.outputs.app_dir }}/build/app/outputs/flutter-apk/*.apk

  # ---------- 3) Web ----------
  web:
    name: Build Web
    needs: [detect, analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Web
        working-directory: ${{ needs.detect.outputs.app_dir }}
        run: |
          flutter pub get
          flutter build web --release

      - name: Zip Web
        run: |
          cd ${{ needs.detect.outputs.app_dir }}/build
          zip -r pos_web.zip web

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ${{ needs.detect.outputs.app_dir }}/build/pos_web.zip

  # ---------- 4) Windows ----------
  windows:
    name: Build Windows
    needs: [detect, analyze]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows
        working-directory: ${{ needs.detect.outputs.app_dir }}
        run: |
          flutter pub get
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Zip Windows
        run: Compress-Archive -Path "${{ needs.detect.outputs.app_dir }}\build\windows\x64\runner\Release\*" -DestinationPath pos_windows.zip

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: pos_windows.zip

  # ---------- 5) iOS ----------
  ios:
    name: Build iOS (no codesign)
    needs: [detect, analyze]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build iOS
        working-directory: ${{ needs.detect.outputs.app_dir }}
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Zip iOS payload
        run: |
          cd ${{ needs.detect.outputs.app_dir }}/build/ios/iphoneos
          zip -r pos_ios.zip Runner.app

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ${{ needs.detect.outputs.app_dir }}/build/ios/iphoneos/pos_ios.zip

  # ---------- 6) Server (يتخطى تلقائياً إذا غير موجود) ----------
  server:
    name: Build Server Executable
    needs: [detect, analyze]
    if: needs.detect.outputs.has_server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Compile Server
        run: |
          cd server
          dart pub get
          dart compile exe bin/server.dart -o pos_server

      - name: Upload Server
        uses: actions/upload-artifact@v4
        with:
          name: server-exe
          path: server/pos_server

  # ---------- 7) Release ----------
  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [detect, analyze, android, web, windows, ios, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: POS Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
            artifacts/**/*.zip
            artifacts/**/pos_server
